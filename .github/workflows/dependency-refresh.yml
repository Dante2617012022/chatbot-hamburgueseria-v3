name: Refresh audited dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: chatbot-dependency-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event.pull_request.head.ref == 'portfolio/security-hygiene-20260804' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: portfolio/security-hygiene-20260804
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install patched Baileys legacy release
        run: npm install --save-exact @whiskeysockets/baileys@6.7.22 --ignore-scripts

      - name: Apply compatible audit fixes
        shell: bash
        run: |
          # npm audit fix returns 1 while moderate findings remain behind a
          # breaking Mercado Pago upgrade. The strict high/critical gate below
          # remains authoritative for this maintenance PR.
          npm audit fix --ignore-scripts || true

      - name: Reinstall from refreshed lockfile
        run: npm ci

      - name: Run full test suite
        env:
          NODE_ENV: test
          RATE_LIMIT_ENABLED: "false"
          ENABLE_WHATSAPP: "false"
          ENABLE_AI_FALLBACK: "false"
          MERCADOPAGO_DRY_RUN: "true"
          MERCADOPAGO_REQUIRE_WEBHOOK_SIGNATURE: "false"
          DATABASE_PATH: data/dependency-refresh-test.sqlite
          MENU_PATH: data/menu.json
          OWNER_PHONE: 5490000000000
        run: npm test

      - name: Enforce production high and critical threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Record remaining moderate advisory
        shell: bash
        run: npm audit --omit=dev --json > dependency-audit.json || true

      - name: Commit refreshed dependencies and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/dependency-refresh.yml
          rm -f dependency-audit.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): refresh audited dependencies"
          git push origin HEAD:portfolio/security-hygiene-20260804
