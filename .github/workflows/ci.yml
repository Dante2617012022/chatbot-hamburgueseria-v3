name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chatbot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          RATE_LIMIT_ENABLED: "false"
          ENABLE_WHATSAPP: "false"
          ENABLE_AI_FALLBACK: "false"
          MERCADOPAGO_DRY_RUN: "true"
          MERCADOPAGO_REQUIRE_WEBHOOK_SIGNATURE: "false"
          DATABASE_PATH: data/ci-test.sqlite
          MENU_PATH: data/menu.json
          OWNER_PHONE: 5490000000000
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        run: |
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            git \
            --redact=100 \
            --exit-code 1 \
            /repo

  supply-chain-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository configuration and current files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

      - name: Prepare security artifact directory
        run: mkdir -p security-artifacts

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: security-artifacts/chatbot-dependencies.cdx.json
          exit-code: 0
          hide-progress: true

      - name: Validate and checksum SBOM
        run: |
          python3 -m json.tool security-artifacts/chatbot-dependencies.cdx.json >/dev/null
          (cd security-artifacts && sha256sum chatbot-dependencies.cdx.json > SHA256SUMS)
          (cd security-artifacts && sha256sum -c SHA256SUMS)

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatbot-security-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 14
