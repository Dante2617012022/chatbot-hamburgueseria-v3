name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chatbot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          RATE_LIMIT_ENABLED: "false"
          ENABLE_WHATSAPP: "false"
          ENABLE_AI_FALLBACK: "false"
          MERCADOPAGO_DRY_RUN: "true"
          MERCADOPAGO_REQUIRE_WEBHOOK_SIGNATURE: "false"
          DATABASE_PATH: data/ci-test.sqlite
          MENU_PATH: data/menu.json
          OWNER_PHONE: 5490000000000
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
